services:

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: visualvault-api:latest
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    depends_on:
      - qdrant
      - redis
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: visualvault-worker:latest
    command: uv run celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: visualvault-ui:latest
    command: uv run streamlit run app/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000
      - DATA_INDEX_DIR=/app/data/index
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow


volumes:
  model_cache:
  grafana_data:
  mlflow_data:
