services:

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      # Persist Qdrant vectors across container restarts
      - ./data/qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Mount data/ so the API can read image files
      - ./data:/app/data
      # Persist downloaded model weights across rebuilds
      - model_cache:/cache
    depends_on:
      - qdrant
      - redis
    env_file:
      - .env

  worker:
    build: .
    command: uv run celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      # Share model weights with the API container — no double download
      - model_cache:/cache
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env

  ui:
    build: .
    command: uv run streamlit run app/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # Containers talk to each other via service name, not localhost
      - API_BASE=http://api:8000
      - DATA_INDEX_DIR=/app/data/index
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  model_cache:
  grafana_data:
