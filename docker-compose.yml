services:

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: visualvault-api:latest
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    depends_on:
      - qdrant
      - redis
      - postgres
    env_file:
      - .env

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8090:8080"
    environment:
      - SECRET_KEY=${LABEL_STUDIO_SECRET_KEY}
      - LABEL_STUDIO_HOST=http://localhost:8090
    volumes:
      - label_studio_data:/label-studio/data

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: visualvault-worker:latest
    command: uv run --no-sync celery -A app.worker.celery_app.celery_app worker --beat --pool=solo --loglevel=info
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LABEL_STUDIO_PROJECT_ID=${LABEL_STUDIO_PROJECT_ID}

    volumes:
      - ./data:/app/data
      - model_cache:/cache
    shm_size: '2gb'
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mlflow:
        condition: service_started
      qdrant:
        condition: service_started
      label-studio:
        condition: service_started
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: visualvault-ui:latest
    command: uv run streamlit run app/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000
      - DATA_INDEX_DIR=/app/data/index
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlruns --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  model_cache:
  grafana_data:
  mlflow_data:
  postgres_data:
  label_studio_data:
