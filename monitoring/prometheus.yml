global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: visualvault_api
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics

  - job_name: visualvault_worker
    static_configs:
      - targets:
          - worker:9101
    metrics_path: /metrics
