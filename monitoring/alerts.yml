groups:
  - name: visualvault.rules
    rules:
      - alert: VisualVaultHighQueueDepth
        expr: visualvault_queue_depth > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: VisualVault queue depth is high
          description: Celery queue depth has been above 100 for more than 2 minutes.

      - alert: VisualVaultHighHTTPP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: VisualVault HTTP p95 latency is high
          description: HTTP p95 latency has been above 200ms for more than 2 minutes.

      - alert: VisualVaultEmbeddingDrift
        expr: visualvault_embedding_drift > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: VisualVault embedding drift detected
          description: Cosine distance between the latest batch and the index baseline has exceeded 0.15 for 5 minutes. Uploaded images may be out of distribution.
